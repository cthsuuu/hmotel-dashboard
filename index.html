function isoDate(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function isHoliday(ds){return !!HOLIDAYS[ds];}
function holidayLabel(ds){return HOLIDAYS[ds]||null;}
function findHolidayCluster(ds){return HOLIDAY_CLUSTERS.find(c=>ds>=c.start&&ds<=c.end)||null;}

function mulberry32(a){
  return function(){
    a|=0;a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

function generateHourlyShape(venue,dow,holiday,rng){
  const hours=new Array(24).fill(0);
  const restPeak=15+(rng()-0.5);
  const stayPeak=23+(rng()-0.5);
  for(let h=0;h<24;h++){
    const dRest=Math.exp(-Math.pow((h-restPeak)/2.4,2));
    const stayH=h<4?h+24:h;
    const dStay=Math.exp(-Math.pow((stayH-stayPeak)/3.0,2));
    hours[h]=dRest*0.55+dStay*0.85;
  }
  if(dow===5||dow===6){for(let h=21;h<24;h++)hours[h]*=1.4;for(let h=0;h<4;h++)hours[h]*=1.3;}
  if(holiday){for(let h=13;h<19;h++)hours[h]*=1.15;}
  if(venue==='jiati'){for(let h=22;h<24;h++)hours[h]*=1.15;for(let h=0;h<5;h++)hours[h]*=1.15;}
  const sum=hours.reduce((a,b)=>a+b,0);
  return hours.map(x=>x/sum);
}
function generateCheckinDistribution(venue,dow,holiday,restCount,stayCount,rng){
  const checkins=new Array(24).fill(0);
  const restPeak=15+(rng()-0.5)*2;
  for(let i=0;i<restCount;i++){const h=Math.max(0,Math.min(23,Math.round(restPeak+(rng()-0.5)*6)));checkins[h]++;}
  const stayPeak=20+(rng()-0.5)*2;
  for(let i=0;i<stayCount;i++){
    const lateNight=rng()<0.15;
    const h=lateNight?Math.floor(rng()*3):Math.max(0,Math.min(23,Math.round(stayPeak+(rng()-0.5)*5)));
    checkins[h]++;
  }
  return checkins;
}
function generateCheckoutDistribution(venue,dow,holiday,restCount,stayCount,rng){
  const checkouts=new Array(24).fill(0);
  const restOutPeak=18+(rng()-0.5)*2;
  for(let i=0;i<restCount;i++){const h=Math.max(0,Math.min(23,Math.round(restOutPeak+(rng()-0.5)*4)));checkouts[h]++;}
  const stayOutPeak=11+(rng()-0.5)*2;
  for(let i=0;i<stayCount;i++){const h=Math.max(0,Math.min(23,Math.round(stayOutPeak+(rng()-0.5)*3)));checkouts[h]++;}
  return checkouts;
}

function generateDaily(seed=42){
  const rng=mulberry32(seed);
  const out={};
  const today=new Date();today.setHours(0,0,0,0);
  const start=new Date(today);start.setFullYear(today.getFullYear()-2);
  const end=new Date(today);end.setDate(today.getDate()+90);
  const cur=new Date(start);
  const trend={xiyue:0.0007,jiati:0.0010};
  const seasonal=[0.92,1.18,0.95,0.98,0.96,1.02,1.08,1.10,0.98,1.04,1.02,1.16];
  let dayIdx=0;
  while(cur<=end){
    const ds=isoDate(cur);
    const future=cur>today;
    const dow=cur.getDay();
    const cluster=findHolidayCluster(ds);
    const hol=isHoliday(ds);
    const weekendBoost=(dow===5)?1.28:(dow===6)?1.45:(dow===0)?1.12:(dow===4)?1.02:0.92;
    const holidayBoost=cluster?1.55:(hol?1.30:1.0);
    out[ds]={date:ds,dow,weekday:dow>=1&&dow<=4,weekend:dow===5||dow===6||dow===0,
      holiday:!!hol,holidayLabel:holidayLabel(ds),
      cluster:cluster?cluster.label:null,future,venues:{}};
    for(const v of ["xiyue","jiati"]){
      const base=VENUE_BASE[v];
      const trendMul=1+trend[v]*dayIdx;
      const season=seasonal[cur.getMonth()];
      const noise=0.85+rng()*0.30;
      const dayTotal=base*trendMul*season*weekendBoost*holidayBoost*noise;
      const mix=VENUE_MIX[v];
      const cats={};let normalize=0;
      for(const c of CATEGORIES){const wob=0.85+rng()*0.30;cats[c]=mix[c]*wob;normalize+=cats[c];}
      const result={};let acc=0;
      for(const c of CATEGORIES){const v2=Math.round((cats[c]/normalize)*dayTotal);result[c]=v2;acc+=v2;}
      const adrRest=v==='xiyue'?1180:950;
      const adrStay=v==='xiyue'?3100:2900;
      const restCount=Math.max(0,Math.min(VENUE_ROOMS[v]*2,Math.round(result["休息"]/adrRest)));
      const stayCount=Math.max(0,Math.min(VENUE_ROOMS[v],Math.round(result["住宿"]/adrStay)));
      const hourly=generateHourlyShape(v,dow,!!hol||!!cluster,rng);
      const checkins=generateCheckinDistribution(v,dow,!!hol||!!cluster,restCount,stayCount,rng);
      const checkouts=generateCheckoutDistribution(v,dow,!!hol||!!cluster,restCount,stayCount,rng);
      out[ds].venues[v]=future?null:{categories:result,total:acc,rooms:{rest:restCount,stay:stayCount,total:VENUE_ROOMS[v]},hourly,checkins,checkouts};
    }
    cur.setDate(cur.getDate()+1);dayIdx++;
  }
  return out;
}

function generateDailyMeta(windowDays=730){
  const out={};

  const start=new Date(today);start.setDate(today.getDate()-windowDays);
  const end=new Date(today);end.setDate(today.getDate()+30);
  const cur=new Date(start);
  while(cur<=end){
    const ds=isoDate(cur);const dow=cur.getDay();
    const future=cur>today;const cluster=findHolidayCluster(ds);const hol=isHoliday(ds);
    out[ds]={date:ds,dow,weekday:dow>=1&&dow<=4,weekend:dow===5||dow===6||dow===0,
      holiday:!!hol,holidayLabel:holidayLabel(ds),cluster:cluster?cluster.label:null,future,venues:{}};
    cur.setDate(cur.getDate()+1);
  }
  return out;
}

// -------- CSV 解析 --------
function parseCSV(text){
  const lines=text.trim().replace(/^﻿/,'').split('\n');
  const headers=lines[0].split(',').map(h=>h.trim());
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cells=lines[i].split(',');
    if(cells.length<2)continue;
    const row={};headers.forEach((h,j)=>{row[h]=(cells[j]||'').trim();});
    if(row.date&&row.venue)rows.push(row);
  }
  return rows;
}

async function loadFromCSV(){
  const files=['jiati_history.csv','xiyue_history.csv'];
  const rows=[];
  for(const f of files){
    try{
      const res=await fetch(f+'?t='+Date.now());
      if(!res.ok)continue;
      const text=await res.text();
      rows.push(...parseCSV(text));
    }catch(e){console.warn('CSV load failed:',f,e);}
  }
  return rows;
}

// -------- API → internal format 轉換 --------
function mergeApiData(apiRows, baseDailyData){
  // 保留日期元資料（節假日/星期），但清空所有假資料
  const merged={};
  for(const [date,dayData] of Object.entries(baseDailyData)){
    merged[date]={...dayData,venues:{}};
  }
  const byDate={};
  for(const row of apiRows){
    const d=typeof row.date==='string'?row.date:isoDate(new Date(row.date));
    if(!byDate[d])byDate[d]={};
    byDate[d][row.venue]=row;
  }
  for(const [date,venues] of Object.entries(byDate)){
    if(!merged[date]){
      const d=new Date(date);const dow=d.getDay();
      merged[date]={date,dow,weekday:dow>=1&&dow<=4,
        weekend:dow===5||dow===6||dow===0,
        holiday:!!HOLIDAYS[date],holidayLabel:HOLIDAYS[date]||null,
        cluster:findHolidayCluster(date)?.label||null,future:false,venues:{}};
    }
    merged[date].future=false;
    for(const [venue,row] of Object.entries(venues)){
      const categories={
        "休息":Number(row.rest_revenue)||0,"住宿":Number(row.stay_revenue)||0,
        "加休":Number(row.addrest_revenue)||0,"加人頭/床":Number(row.addperson_revenue)||0,
        "餐飲":Number(row.fnb_revenue)||0,"其他":Number(row.other_revenue)||0
      };
      const total=Object.values(categories).reduce((a,b)=>a+b,0);
      const rooms={rest:Number(row.rest_count)||0,stay:Number(row.stay_count)||0,
        total:venue==='xiyue'?32:26};
      const dow=merged[date].dow;
      const hol=!!HOLIDAYS[date];
      const seed=(date+venue).split('').reduce((a,b)=>a+b.charCodeAt(0),0);
      const hourly=generateHourlyShape(venue,dow,hol,mulberry32(seed));
      const checkins=generateCheckinDistribution(venue,dow,hol,rooms.rest,rooms.stay,mulberry32(seed+1));
      const checkouts=generateCheckoutDistribution(venue,dow,hol,rooms.rest,rooms.stay,mulberry32(seed+2));
      merged[date].venues[venue]={categories,total,rooms,hourly,checkins,checkouts};
    }
  }
  return merged;
}

// -------- 格式化工具 --------
function nf(n){if(n==null||isNaN(n))return"—";return new Intl.NumberFormat("zh-TW").format(Math.round(n));}
function nfShort(n){
  if(n==null||isNaN(n))return"—";const abs=Math.abs(n);
  if(abs>=1e8)return(n/1e8).toFixed(1)+" 億";
  if(abs>=1e4){const w=Math.round(n/1e4*10)/10;return(w===Math.floor(w)?w.toFixed(0):w.toFixed(1))+" 萬";}
  return nf(n);
}
function nfPct(n,d=1){if(n==null||isNaN(n))return"—";return(n*100).toFixed(d)+"%";}
function nfSigned(n){const s=n>=0?"+":" −";return s+nfShort(Math.abs(n));}

function niceTicks(maxVal,count=5){
  if(!maxVal||maxVal<=0)return[0,1,2,3,4,5];
  const rough=maxVal/count,mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const norm=rough/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const top=Math.ceil(maxVal/step)*step;
  const out=[];for(let v=0;v<=top+1e-6;v+=step)out.push(Math.round(v));
  return out;
}

function StackedBarTrend({rows,height=260,onBarClick,highlightHolidays=true,dimension="day",venueKey="combined",forecast=null,kpi=null}){
  const wrapRef=useRef(null);const[w,setW]=useState(900);
  useEffect(()=>{if(!wrapRef.current)return;const ro=new ResizeObserver(es=>{for(const e of es)setW(Math.floor(e.contentRect.width));});ro.observe(wrapRef.current);return()=>ro.disconnect();},[]);
  const padL=56,padR=18,padT=18,padB=38;
  const innerW=Math.max(50,w-padL-padR),innerH=height-padT-padB;
  const n=rows.length||1;const barW=Math.max(2,(innerW/n)*0.78);const xStep=innerW/n;
  const maxVal=Math.max(1,...rows.map(r=>r.total||0),kpi||0);
  const ticks=niceTicks(maxVal,4);const yMax=ticks[ticks.length-1];
  const yFor=v=>padT+innerH-(v/yMax)*innerH;const xFor=i=>padL+i*xStep+xStep/2;
  const bands=[];
  rows.forEach((r,i)=>{const tag=r.cluster?"cluster":(r.weekend?"weekend":null);if(!tag)return;const last=bands[bands.length-1];if(last&&last.tag===tag&&last.end===i-1)last.end=i;else bands.push({start:i,end:i,tag,label:r.cluster});});
  const[hover,setHover]=useState(null);
  return(
    <div ref={wrapRef} className="chart-wrap" style={{position:"relative"}}>
      <svg width={w} height={height} style={{display:"block",overflow:"visible"}}>
        {ticks.map((t,i)=>(
          <g key={"t"+i}>
            <line x1={padL} x2={padL+innerW} y1={yFor(t)} y2={yFor(t)} stroke="rgba(88,87,85,0.10)" strokeDasharray={i===0?"0":"3 4"}/>
            <text x={padL-8} y={yFor(t)} fontSize="10" fill="#8A8985" textAnchor="end" dominantBaseline="middle" fontFamily="JetBrains Mono,monospace">{nfShort(t)}</text>
          </g>
        ))}
        {highlightHolidays&&bands.map((b,i)=>{const x=padL+b.start*xStep;const wB=(b.end-b.start+1)*xStep;const fill=b.tag==="cluster"?"rgba(214,35,59,0.06)":"rgba(239,229,79,0.18)";return<rect key={"b"+i} x={x} y={padT} width={wB} height={innerH} fill={fill}/>;})}
        {kpi!=null&&dimension==="day"&&(
          <g>
            <line x1={padL} x2={padL+innerW} y1={yFor(kpi)} y2={yFor(kpi)} stroke="#585755" strokeDasharray="6 4" strokeWidth="1"/>
            <text x={padL+innerW+4} y={yFor(kpi)} fontSize="10" fill="#585755" dominantBaseline="middle" fontFamily="JetBrains Mono,monospace">日均目標 {nfShort(kpi)}</text>
          </g>
        )}
        {rows.map((r,i)=>{
          if(!r.total)return null;let yAcc=padT+innerH;
          return(
            <g key={"bar"+i} transform={`translate(${xFor(i)-barW/2},0)`}
               onMouseEnter={()=>setHover({i,x:xFor(i),y:yFor(r.total),row:r})}
               onMouseLeave={()=>setHover(null)}
               onClick={()=>onBarClick&&onBarClick(r)}
               style={{cursor:"pointer"}}>
              {CATEGORIES.map((c,j)=>{const v=r.cats[c];if(!v)return null;const h=(v/yMax)*innerH;yAcc-=h;return<rect key={c} x={0} y={yAcc} width={barW} height={Math.max(0.5,h)} fill={CAT_COLORS[c]} opacity={r.future?0.35:1} stroke={r.future?"#585755":"none"} strokeDasharray={r.future?"2 2":"0"}/>;})}
              {hover&&hover.i===i&&<rect x={-2} y={yFor(r.total)-2} width={barW+4} height={innerH-(yFor(r.total)-padT)+4} fill="none" stroke="#1C1B19" strokeWidth="1" rx="2"/>}
            </g>
          );
        })}
        {forecast&&forecast.points&&(
          <g>
            <path d={"M "+forecast.points.map(p=>`${xFor(p.i)} ${yFor(p.v)}`).join(" L ")} fill="none" stroke="#3B3A38" strokeWidth="1.5" strokeDasharray="4 3"/>
            {forecast.points.map((p,i)=><circle key={i} cx={xFor(p.i)} cy={yFor(p.v)} r="2.5" fill="#FBF9F2" stroke="#3B3A38" strokeWidth="1"/>)}

function HourHeatmap({days,height=220,mode="rooms",onModeChange}){
  const wrapRef=useRef(null);const[w,setW]=useState(900);
  useEffect(()=>{if(!wrapRef.current)return;const ro=new ResizeObserver(es=>{for(const e of es)setW(Math.floor(e.contentRect.width));});ro.observe(wrapRef.current);return()=>ro.disconnect();},[]);
  const padL=36,padR=18,padT=14,padB=32;
  const innerW=Math.max(50,w-padL-padR),innerH=height-padT-padB;
  const cellW=innerW/24,cellH=innerH/Math.max(1,days.length);
  let maxV=0;
  for(const d of days)for(let h=0;h<24;h++){let val=mode==="checkin"?(d.checkins&&d.checkins[h])||0:mode==="checkout"?(d.checkouts&&d.checkouts[h])||0:((d.restRooms||0)+(d.stayRooms||0))*d.hourly[h];maxV=Math.max(maxV,val);}
  const colorFor=v=>{if(!v)return"#FBF9F2";const t=Math.min(1,v/maxV);if(t<0.5){const p=t/0.5;return`rgba(239,229,79,${0.20+p*0.65})`;}else{const p=(t-0.5)/0.5;return`rgba(88,87,85,${0.55+p*0.35})`;}};
  const[hov,setHov]=useState(null);
  return(
    <div ref={wrapRef} className="chart-wrap" style={{position:"relative"}}>
      <svg width={w} height={height} style={{display:"block"}}>
        {days.map((d,i)=>(
          <g key={d.date} transform={`translate(${padL},${padT+i*cellH})`}>
            <text x={-6} y={cellH/2} fontSize="9" fill="#8A8985" textAnchor="end" dominantBaseline="middle" fontFamily="JetBrains Mono,monospace">{d.label}</text>
            {Array.from({length:24},(_,h)=>{let v=mode==="checkin"?(d.checkins&&d.checkins[h])||0:mode==="checkout"?(d.checkouts&&d.checkouts[h])||0:((d.restRooms||0)+(d.stayRooms||0))*d.hourly[h];return(<rect key={h} x={h*cellW} y={1} width={Math.max(0.5,cellW-1)} height={Math.max(0.5,cellH-1)} fill={colorFor(v)} onMouseEnter={()=>setHov({d,h,v,x:padL+h*cellW+cellW/2,y:padT+i*cellH,mode})} onMouseLeave={()=>setHov(null)} style={{cursor:"crosshair"}}/>);})}
          </g>
        ))}
        {[0,3,6,9,12,15,18,21].map(h=><text key={h} x={padL+h*cellW+cellW/2} y={padT+days.length*cellH+14} fontSize="9" fill="#8A8985" textAnchor="middle" fontFamily="JetBrains Mono,monospace">{String(h).padStart(2,"0")}</text>)}
        <text x={padL+24*cellW} y={padT+days.length*cellH+14} fontSize="9" fill="#8A8985" textAnchor="end" fontFamily="JetBrains Mono,monospace">時 / hour</text>
      </svg>
      {hov&&<div style={{position:"absolute",left:Math.min(hov.x+8,w-140),top:hov.y,background:"#1C1B19",color:"#FBF9F2",padding:"6px 8px",borderRadius:6,fontSize:11,pointerEvents:"none",whiteSpace:"nowrap",zIndex:30}}><div style={{fontFamily:"var(--font-mono)"}}>{hov.d.label} · {String(hov.h).padStart(2,"0")}:00</div><div style={{fontFamily:"var(--font-mono)",color:"#EFE54F"}}>{Math.round(hov.v)} 組</div></div>}
      {onModeChange&&<div style={{position:"absolute",top:8,right:8,display:"flex",gap:4,zIndex:10}}><button className="heat-mode-btn" data-active={mode==="checkin"} onClick={()=>onModeChange("checkin")}>Check-in</button><button className="heat-mode-btn" data-active={mode==="checkout"} onClick={()=>onModeChange("checkout")}>Check-out</button></div>}
    </div>
  );
}

function CategoryDonut({cats,total,size=180,label="總營收"}){
  const r=size/2-14,cx=size/2,cy=size/2;
  let acc=0;
  const arcs=CATEGORIES.map(c=>{const v=cats[c]||0;const frac=total?v/total:0;const start=acc;acc+=frac;const end=acc;return{c,v,frac,start,end};});
  const arcPath=(s,e)=>{if(e-s<1e-6)return"";const a0=s*Math.PI*2-Math.PI/2;const a1=e*Math.PI*2-Math.PI/2;const large=(e-s)>0.5?1:0;const x0=cx+Math.cos(a0)*r,y0=cy+Math.sin(a0)*r;const x1=cx+Math.cos(a1)*r,y1=cy+Math.sin(a1)*r;const xi0=cx+Math.cos(a0)*(r-22),yi0=cy+Math.sin(a0)*(r-22);const xi1=cx+Math.cos(a1)*(r-22),yi1=cy+Math.sin(a1)*(r-22);return`M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${r-22} ${r-22} 0 ${large} 0 ${xi0} ${yi0} Z`;};
  return(
    <div style={{display:"flex",gap:16,alignItems:"center"}}>
      <svg width={size} height={size}>{arcs.map(a=>a.frac>0&&<path key={a.c} d={arcPath(a.start,a.end)} fill={CAT_COLORS[a.c]}/>)}<text x={cx} y={cy-4} textAnchor="middle" fontSize="10" fill="#8A8985" letterSpacing="0.12em">{label}</text><text x={cx} y={cy+14} textAnchor="middle" fontSize="16" fill="#1C1B19" fontFamily="JetBrains Mono,monospace" fontWeight="700">{nfShort(total)}</text></svg>
      <div style={{flex:1,display:"grid",gap:6}}>{arcs.map(a=>(<div key={a.c} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}><span style={{width:10,height:10,background:CAT_COLORS[a.c],borderRadius:2,flex:"0 0 auto"}}/><span style={{flex:1,color:"#3B3A38"}}>{a.c}</span><span style={{fontFamily:"var(--font-mono)",color:"#585755"}}>{nfShort(a.v)}</span><span style={{fontFamily:"var(--font-mono)",color:"#8A8985",width:38,textAlign:"right"}}>{nfPct(a.frac,0)}</span></div>))}</div>
    </div>
  );
}

function ForecastBar({actual,forecast,target,label="本月"}){
  const max=Math.max(actual,forecast,target)*1.05;
  const pctActual=(actual/max)*100,pctForecast=(forecast/max)*100,pctTarget=(target/max)*100;
  const willHit=forecast>=target;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:11,color:"#8A8985",letterSpacing:"0.08em",textTransform:"uppercase"}}>
        <span>{label}進度</span>
        <span style={{fontFamily:"var(--font-mono)",color:willHit?"#4F8A5C":"#C0392B",fontWeight:700}}>預估達成 {nfPct(forecast/target,1)}</span>
      </div>
      <div style={{position:"relative",height:14,background:"#FBF9F2",borderRadius:999,overflow:"hidden"}}>
        <div style={{position:"absolute",left:0,top:0,height:"100%",width:pctActual+"%",background:"var(--hm-gray)",transition:"width 600ms"}}/>
        <div style={{position:"absolute",left:pctActual+"%",top:0,height:"100%",width:Math.max(0,pctForecast-pctActual)+"%",background:"repeating-linear-gradient(135deg,var(--hm-yellow) 0 6px,var(--hm-yellow-soft) 6px 12px)"}}/>
        <div style={{position:"absolute",left:pctTarget+"%",top:-2,bottom:-2,width:2,background:"#1C1B19"}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontFamily:"var(--font-mono)",fontSize:11,color:"#585755"}}>
        <span><span style={{color:"#8A8985"}}>實際</span> {nfShort(actual)}</span>
        <span><span style={{color:"#8A8985"}}>預估</span> {nfShort(forecast)}</span>
        <span><span style={{color:"#8A8985"}}>目標</span> {nfShort(target)}</span>
      </div>
    </div>
  );
}

function SparklineLite({values,kpi}){
  const w=220,h=36;if(!values||!values.length)return null;
  const max=Math.max(kpi||0,...values);const step=w/(values.length-1||1);
  const path=values.map((v,i)=>`${i===0?"M":"L"} ${i*step} ${h-v/max*h}`).join(" ");
  return(<svg width={w} height={h} style={{display:"block",width:"100%"}} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">{kpi&&<line x1={0} x2={w} y1={h-kpi/max*h} y2={h-kpi/max*h} stroke="#1C1B19" strokeDasharray="3 3" strokeWidth="1"/>}<path d={path} fill="none" stroke="#585755" strokeWidth="1.5"/>{values.map((v,i)=><circle key={i} cx={i*step} cy={h-v/max*h} r="1.5" fill="#EFE54F" stroke="#585755" strokeWidth="0.6"/>)}</svg>);
}

// =====================================================================
// 資料計算函式
// =====================================================================
function emptyCatRecord(){const o={};for(const c of CATEGORIES)o[c]=0;return o;}
function emptyCats(){const o={total:0,rest:0,stay:0};for(const c of CATEGORIES)o[c]=0;return o;}
function sumCats(cats){let s=0;for(const c of CATEGORIES)s+=cats[c]||0;return s;}
function catsFor(d,view){const out=emptyCatRecord();if(!d)return out;if(view==="combined"){for(const v of["xiyue","jiati"]){if(!d.venues[v])continue;for(const c of CATEGORIES)out[c]+=d.venues[v].categories[c];}}else if(d.venues[view]){for(const c of CATEGORIES)out[c]=d.venues[view].categories[c];}return out;}
function roomsFor(d,view){if(!d)return{rest:0,stay:0,total:0};if(view==="combined"){let rest=0,stay=0,total=0;for(const v of["xiyue","jiati"]){if(!d.venues[v])continue;rest+=d.venues[v].rooms.rest;stay+=d.venues[v].rooms.stay;total+=d.venues[v].rooms.total;}return{rest,stay,total};}return d.venues[view]?d.venues[view].rooms:{rest:0,stay:0,total:VENUE_ROOMS[view]};}
function catsFromAgg(node,view){const out=emptyCatRecord();if(view==="combined"){for(const v of["xiyue","jiati"])for(const c of CATEGORIES)out[c]+=node.venues[v][c]||0;}else for(const c of CATEGORIES)out[c]=node.venues[view][c]||0;return out;}
function roomsFromAgg(node,view){if(view==="combined")return{rest:(node.venues.xiyue.rest||0)+(node.venues.jiati.rest||0),stay:(node.venues.xiyue.stay||0)+(node.venues.jiati.stay||0)};return{rest:node.venues[view].rest||0,stay:node.venues[view].stay||0};}

function aggregateMonthly(daily){
  const months={};
  for(const d of Object.values(daily)){
    if(!d.venues.xiyue&&!d.venues.jiati)continue;
    const key=d.date.slice(0,7);
    if(!months[key])months[key]={date:key,venues:{xiyue:emptyCats(),jiati:emptyCats()},days:0,holidayDays:0,weekendDays:0};
    months[key].days++;if(d.holiday||d.cluster)months[key].holidayDays++;if(d.weekend)months[key].weekendDays++;
    for(const v of["xiyue","jiati"]){if(!d.venues[v])continue;for(const c of CATEGORIES)months[key].venues[v][c]+=d.venues[v].categories[c];months[key].venues[v].total=(months[key].venues[v].total||0)+d.venues[v].total;months[key].venues[v].rest=(months[key].venues[v].rest||0)+d.venues[v].rooms.rest;months[key].venues[v].stay=(months[key].venues[v].stay||0)+d.venues[v].rooms.stay;}
  }
  return months;
}
function aggregateYearly(daily){
  const years={};
  for(const d of Object.values(daily)){
    if(!d.venues.xiyue&&!d.venues.jiati)continue;
    const key=d.date.slice(0,4);
    if(!years[key])years[key]={date:key,venues:{xiyue:emptyCats(),jiati:emptyCats()},days:0};
    years[key].days++;
    for(const v of["xiyue","jiati"]){if(!d.venues[v])continue;for(const c of CATEGORIES)years[key].venues[v][c]+=d.venues[v].categories[c];years[key].venues[v].total=(years[key].venues[v].total||0)+d.venues[v].total;years[key].venues[v].rest=(years[key].venues[v].rest||0)+d.venues[v].rooms.rest;years[key].venues[v].stay=(years[key].venues[v].stay||0)+d.venues[v].rooms.stay;}
  }
  return years;
}

function buildSeries(daily,dimension,view,customRange){
  const allKeys=Object.keys(daily).sort();const todayStr=isoDate(new Date());
  let rows=[],totalsByCat=emptyCatRecord(),totals={total:0};
  if(dimension==="day"){
    const N=30;let keys;
    if(customRange){keys=allKeys.filter(k=>k>=customRange.start&&k<=customRange.end);}
    else{const lastIdx=allKeys.indexOf(todayStr);const end=lastIdx>=0?lastIdx:allKeys.length-1;keys=allKeys.slice(Math.max(0,end-N+1),end+1);}
    rows=keys.map(k=>{const d=daily[k];const cats=catsFor(d,view);const rooms=roomsFor(d,view);const total=sumCats(cats);for(const c of CATEGORIES)totalsByCat[c]+=cats[c];totals.total+=total;const m=k.slice(5,7),dd=k.slice(8,10);return{label:`${parseInt(m)}/${parseInt(dd)}`,date:k,dailyKey:k,dow:d.dow,weekend:d.weekend,holiday:d.holiday,cluster:d.cluster,holidayLabel:d.holidayLabel,future:d.future,cats,rooms,total};});
    const past14=allKeys.filter(k=>k<todayStr).slice(-14);const past14Avg=past14.length?past14.reduce((a,k)=>a+sumCats(catsFor(daily[k],view)),0)/past14.length:0;
    const monthKeys=allKeys.filter(k=>k.slice(0,7)===todayStr.slice(0,7));
    const forecastPts=[];
    monthKeys.forEach((k,i)=>{if(k<=todayStr)return;const d=daily[k];if(!d)return;const boost=(d.dow===6?1.45:d.dow===5?1.28:1);const v=past14Avg*boost/1.05;const idx=rows.findIndex(r=>r.dailyKey===k);if(idx>=0)forecastPts.push({i:idx,v});});
    return{rows,totalsByCat,totals,forecast:forecastPts.length?{points:forecastPts}:null};
  } else if(dimension==="month"){
    const months=aggregateMonthly(daily);const orderedM=Object.keys(months).sort();
    const lastIdx=orderedM.findIndex(m=>m>todayStr.slice(0,7));const endIdx=lastIdx===-1?orderedM.length-1:lastIdx-1;
    const sliced=orderedM.slice(Math.max(0,endIdx-11),endIdx+1);
    rows=sliced.map(mk=>{const m=months[mk];const cats=catsFromAgg(m,view);const total=sumCats(cats);const rest=roomsFromAgg(m,view).rest,stay=roomsFromAgg(m,view).stay;for(const c of CATEGORIES)totalsByCat[c]+=cats[c];totals.total+=total;const dailyKeys=Object.keys(daily).filter(k=>k.startsWith(mk));return{label:mk.slice(2,4)+"/"+mk.slice(5,7),date:mk,dailyKeys,dow:0,weekend:false,holiday:m.holidayDays>0,cluster:m.holidayDays>=4?"含年節":null,cats,rooms:{rest,stay,total:VENUE_ROOMS.xiyue+VENUE_ROOMS.jiati},total};});
    return{rows,totalsByCat,totals,forecast:null};
  } else {
    const years=aggregateYearly(daily);const orderedY=Object.keys(years).sort();
    rows=orderedY.slice(-3).map(yk=>{const y=years[yk];const cats=catsFromAgg(y,view);const total=sumCats(cats);const rest=roomsFromAgg(y,view).rest,stay=roomsFromAgg(y,view).stay;for(const c of CATEGORIES)totalsByCat[c]+=cats[c];totals.total+=total;const dailyKeys=Object.keys(daily).filter(k=>k.startsWith(yk));return{label:yk,date:yk,dailyKeys,dow:0,weekend:false,holiday:false,cluster:null,cats,rooms:{rest,stay,total:VENUE_ROOMS.xiyue+VENUE_ROOMS.jiati},total};});
    return{rows,totalsByCat,totals,forecast:null};
  }
}

function buildMonthSnapshot(daily,view,target){
  const now=new Date();const todayStr=isoDate(now);const ym=todayStr.slice(0,7);
  // 營業日截止 08:00：一天的資料在隔天 08:00 後才算完整
  const refStr=isoDate(new Date(now.getTime()-8*3600*1000));
  const allKeys=Object.keys(daily).sort();
  const monthKeys=allKeys.filter(k=>k.slice(0,7)===ym);
  const elapsed=monthKeys.filter(k=>k<refStr&&!daily[k].future);
  let actual=0;const dailySeries=[];
  for(const k of elapsed){const total=sumCats(catsFor(daily[k],view));actual+=total;dailySeries.push(total);}
  const daysInMonth=new Date(parseInt(ym.slice(0,4)),parseInt(ym.slice(5,7)),0).getDate();
  const daysElapsed=elapsed.length;const dailyAvg=daysElapsed?actual/daysElapsed:0;
  const past14=allKeys.filter(k=>k<refStr).slice(-14);
  const past14Avg=past14.length?past14.reduce((a,k)=>a+sumCats(catsFor(daily[k],view)),0)/past14.length:dailyAvg;
  let forecastRem=0;
  for(const k of monthKeys){if(k<=refStr)continue;const d=daily[k];if(!d)continue;const boost=(d.dow===6?1.45:d.dow===5?1.28:1);forecastRem+=past14Avg*boost/1.05;}
  const forecast=actual+forecastRem,completion=actual/target;
  const yesterdayKey=elapsed[elapsed.length-1];const yd=yesterdayKey?daily[yesterdayKey]:null;
  const yRooms=yd?roomsFor(yd,view):{rest:0,stay:0,total:view==="combined"?58:VENUE_ROOMS[view]};
  const yCats=yd?catsFor(yd,view):emptyCatRecord();const yTotalRev=sumCats(yCats);
  const monLabel=parseInt(ym.slice(5,7))+"月";
  return{label:monLabel,actual,forecast,target,dailyAvg,daysInMonth,daysElapsed,completion,dailySeries,yesterday:{rest:yRooms.rest,stay:yRooms.stay,totalRooms:yRooms.total,restRev:yCats["休息"],stayRev:yCats["住宿"],totalRev:yTotalRev}};
}

function buildYoY(daily,view,mode="yoy"){
  const allKeys=Object.keys(daily).sort();const todayStr=isoDate(new Date());
  if(mode==="yoy"){
    const past30=allKeys.filter(k=>k<=todayStr&&!daily[k].future).slice(-30);
    let thisYear=0;for(const k of past30)thisYear+=sumCats(catsFor(daily[k],view));
    const lastYearKeys=past30.map(k=>{const d=new Date(k);d.setFullYear(d.getFullYear()-1);return isoDate(d);}).filter(k=>daily[k]&&!daily[k].future);
    let lastYear=0;for(const k of lastYearKeys)lastYear+=sumCats(catsFor(daily[k],view));
    return{mode:"yoy",thisVal:thisYear,lastVal:lastYear,pct:lastYear?(thisYear-lastYear)/lastYear:0,thisLabel:"今年",lastLabel:"去年"};
  } else if(mode==="mom"){
    const thisMonth=todayStr.slice(0,7);
    const lastMonthDate=new Date(thisMonth+"-01");lastMonthDate.setMonth(lastMonthDate.getMonth()-1);
    const lastMonth=isoDate(lastMonthDate).slice(0,7);
    const thisMonthKeys=allKeys.filter(k=>k.slice(0,7)===thisMonth&&k<=todayStr&&!daily[k].future);
    const lastMonthKeys=allKeys.filter(k=>k.slice(0,7)===lastMonth&&!daily[k].future).slice(0,thisMonthKeys.length);
    let thisVal=0,lastVal=0;
    for(const k of thisMonthKeys)thisVal+=sumCats(catsFor(daily[k],view));
    for(const k of lastMonthKeys)lastVal+=sumCats(catsFor(daily[k],view));
    return{mode:"mom",thisVal,lastVal,pct:lastVal?(thisVal-lastVal)/lastVal:0,thisLabel:"本月",lastLabel:"上月"};
  } else {
    const recentCluster=HOLIDAY_CLUSTERS.filter(c=>c.end<=todayStr).slice(-1)[0];
    if(!recentCluster)return{mode:"holiday",thisVal:0,lastVal:0,pct:0,thisLabel:"今年",lastLabel:"去年"};
    const thisKeys=allKeys.filter(k=>k>=recentCluster.start&&k<=recentCluster.end&&!daily[k].future);
    const lastYearStart=new Date(recentCluster.start);lastYearStart.setFullYear(lastYearStart.getFullYear()-1);
    const lastYearEnd=new Date(recentCluster.end);lastYearEnd.setFullYear(lastYearEnd.getFullYear()-1);
    const lastKeys=allKeys.filter(k=>k>=isoDate(lastYearStart)&&k<=isoDate(lastYearEnd)&&!daily[k].future);
    let thisVal=0,lastVal=0;
    for(const k of thisKeys)thisVal+=sumCats(catsFor(daily[k],view));
    for(const k of lastKeys)lastVal+=sumCats(catsFor(daily[k],view));
    return{mode:"holiday",thisVal,lastVal,pct:lastVal?(thisVal-lastVal)/lastVal:0,thisLabel:recentCluster.label,lastLabel:"去年同期"};
  }
}

function buildPerformanceMetrics(daily,view,dimension){
  const allKeys=Object.keys(daily).sort();const todayStr=isoDate(new Date());
  const window=allKeys.filter(k=>k<=todayStr&&!daily[k].future).slice(-30);
  let totalRev=0,totalOccupied=0,totalRest=0,totalStayRev=0,totalRestRev=0,sumStayRate=0,sumRestRate=0,sumUtil=0;
  const roomCap=TOTAL_ROOMS[view]||(VENUE_ROOMS.xiyue+VENUE_ROOMS.jiati);
  for(const k of window){const d=daily[k];if(!d)continue;const cats=catsFor(d,view);const rev=sumCats(cats);const rooms=roomsFor(d,view);totalRev+=rev;totalOccupied+=rooms.stay;totalRest+=rooms.rest;totalStayRev+=cats["住宿"];totalRestRev+=cats["休息"];sumStayRate+=rooms.stay/roomCap;sumRestRate+=rooms.rest/roomCap;sumUtil+=(rooms.stay+rooms.rest)/roomCap;}
  const days=window.length||1;
  return{revPAR:totalRev/(roomCap*days),stayADR:totalOccupied>0?totalStayRev/totalOccupied:0,restADR:totalRest>0?totalRestRev/totalRest:0,stayRate:sumStayRate/days,restRate:sumRestRate/days,utilization:sumUtil/days,period:"近 30 日",roomCap};
}
function buildWeekdayAvg(daily,view){
  const allKeys=Object.keys(daily).sort();
  const now=new Date();const refStr=isoDate(new Date(now.getTime()-8*3600*1000));
  const recent=allKeys.filter(k=>k<refStr&&!daily[k].future).slice(-84);
  const sums=[0,0,0,0,0,0,0],counts=[0,0,0,0,0,0,0];
  for(const k of recent){const d=daily[k];if(!d)continue;const total=sumCats(catsFor(d,view));if(!total)continue;sums[d.dow]+=total;counts[d.dow]++;}
  const avgs=sums.map((s,i)=>counts[i]?Math.round(s/counts[i]):0);
  return{avgs,max:Math.max(...avgs)||1,counts,labels:["日","一","二","三","四","五","六"]};
}
function buildYesterdayComp(daily,view){
  const allKeys=Object.keys(daily).sort();
  const now=new Date();const refStr=isoDate(new Date(now.getTime()-8*3600*1000));
  const done=allKeys.filter(k=>k<refStr&&!daily[k].future);
  const ydKey=done[done.length-1];if(!ydKey)return null;
  const yd=daily[ydKey];const ydCats=catsFor(yd,view);const ydRooms=roomsFor(yd,view);const ydTotal=sumCats(ydCats);
  const p14=done.slice(-15,-1);
  const avg=(fn)=>p14.length?p14.reduce((a,k)=>a+fn(daily[k]),0)/p14.length:0;
  return{date:ydKey,total:ydTotal,totalAvg:avg(d=>sumCats(catsFor(d,view))),stay:ydRooms.stay,stayAvg:avg(d=>roomsFor(d,view).stay),rest:ydRooms.rest,restAvg:avg(d=>roomsFor(d,view).rest)};
}

function buildHeatmap(daily,view){
  const allKeys=Object.keys(daily).sort();const todayStr=isoDate(new Date());
  const past14=allKeys.filter(k=>k<=todayStr&&!daily[k].future).slice(-14);
  return past14.map(k=>{
    const d=daily[k];if(!d)return null;
    const total=sumCats(catsFor(d,view));const rooms=roomsFor(d,view);
    let hourly=new Array(24).fill(0),checkins=new Array(24).fill(0),checkouts=new Array(24).fill(0);
    if(view==="combined"){for(const v of["xiyue","jiati"]){if(!d.venues[v])continue;const t=d.venues[v].total;for(let h=0;h<24;h++){hourly[h]+=d.venues[v].hourly[h]*t;checkins[h]+=d.venues[v].checkins[h];checkouts[h]+=(d.venues[v].checkouts||new Array(24).fill(0))[h];}}const s=hourly.reduce((a,b)=>a+b,0);if(s)hourly=hourly.map(x=>x/s);}
    else{hourly=d.venues[view]?d.venues[view].hourly:hourly;checkins=d.venues[view]?d.venues[view].checkins:checkins;checkouts=d.venues[view]?(d.venues[view].checkouts||checkouts):checkouts;}
    return{date:k,label:`${parseInt(k.slice(5,7))}/${parseInt(k.slice(8,10))} ${["日","一","二","三","四","五","六"][d.dow]}`,dow:d.dow,total,hourly,restRooms:rooms.rest,stayRooms:rooms.stay,checkins,checkouts};
  }).filter(Boolean);
}

function buildForecastAlerts(daily,view,monthlyTarget){
  const allKeys=Object.keys(daily).sort();const todayStr=isoDate(new Date());
  const todayIdx=allKeys.indexOf(todayStr);const startIdx=todayIdx>=0?todayIdx:allKeys.length-1;
  const future7Keys=allKeys.slice(startIdx,startIdx+7);const dailyTarget=monthlyTarget/30;
  const past14=allKeys.filter(k=>k<=todayStr&&!daily[k].future).slice(-14);
  const past14Avg=past14.length?past14.reduce((a,k)=>a+sumCats(catsFor(daily[k],view)),0)/past14.length:dailyTarget;
  const days=future7Keys.map(k=>{const d=daily[k];if(!d)return null;const boost=(d.dow===6?1.45:d.dow===5?1.28:1);const forecast=past14Avg*boost/1.05;const pct=forecast/dailyTarget;const status=pct>=1?"ok":pct>=0.85?"warn":"alert";const m=k.slice(5,7),dd=k.slice(8,10);return{date:k,label:`${parseInt(m)}/${parseInt(dd)} ${["日","一","二","三","四","五","六"][d.dow]}`,forecast,target:dailyTarget,status};}).filter(Boolean);
  const lowDays=days.filter(d=>d.status==="alert").length;
  return{days,summary:lowDays>0?`⚠️ ${lowDays} 天預估低於目標 85%`:"✓ 未來一週預估正常"};
}

function RangePicker({current,onApply,onClose}){
  const today=isoDate(new Date());

  const[end,setEnd]=useState(current?.end||today);
  return(<div className="range-pop"><label>起 <input type="date" value={start} onChange={e=>setStart(e.target.value)}/></label><label>迄 <input type="date" value={end} onChange={e=>setEnd(e.target.value)}/></label><button className="btn-primary-sm" onClick={()=>onApply({start,end})}>套用</button><button className="btn-ghost-sm" onClick={()=>{onApply(null);onClose();}}>清除</button></div>);

function KpiCard({eyebrow,big,tag,tagColor,sub,children}){

function DrillDown({row,onClose,dimension,venueKey,daily}){
  const venuesBreak=useMemo(()=>{
    if(row.dailyKey){const d=daily[row.dailyKey];if(!d)return null;return["xiyue","jiati"].map(v=>({v,name:VENUE_COLORS[v].label,cats:d.venues[v]?d.venues[v].categories:null,total:d.venues[v]?.total,rooms:d.venues[v]?.rooms}));}
    else if(row.dailyKeys){const out=["xiyue","jiati"].map(v=>{const cats=emptyCatRecord();let total=0,rest=0,stay=0;for(const k of row.dailyKeys){const dv=daily[k]?.venues[v];if(!dv)continue;for(const c of CATEGORIES)cats[c]+=dv.categories[c];total+=dv.total;rest+=dv.rooms.rest;stay+=dv.rooms.stay;}return{v,name:VENUE_COLORS[v].label,cats,total,rooms:{rest,stay,total:VENUE_ROOMS[v]}};});return out;}
    return null;
  },[row,daily]);
  return(<div className="drill-overlay" onClick={onClose}><div className="drill-panel" onClick={e=>e.stopPropagation()}><div className="drill-head"><div><div className="eyebrow">細項分析</div><h3 style={{margin:0}}>{row.label}</h3><div className="text-xs muted" style={{marginTop:4}}>{row.cluster?`🏮 ${row.cluster}・`:""}{row.holidayLabel?`${row.holidayLabel}・`:""}{row.weekend?"週末":dimension==="day"?"平日":""}・總營收 {nfShort(row.total)}</div></div><button className="btn-ghost-sm" onClick={onClose}>✕ 關閉</button></div><div className="drill-grid">{venuesBreak&&venuesBreak.map(vb=><div key={vb.v} className="drill-venue"><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}><span style={{fontWeight:600}}><span className={"dot dot-"+vb.v}/> {vb.name}</span><span className="mono-tabular" style={{fontSize:18,fontWeight:700}}>{nfShort(vb.total)}</span></div>{vb.cats&&<div className="drill-cats">{CATEGORIES.map(c=>{const v=vb.cats[c]||0;const pct=vb.total?v/vb.total:0;return(<div key={c} className="drill-cat-row"><span style={{display:"inline-flex",alignItems:"center",gap:6,width:60}}><i style={{width:8,height:8,background:CAT_COLORS[c],borderRadius:2}}/>{c}</span><div className="drill-cat-bar"><div style={{width:pct*100+"%",background:CAT_COLORS[c]}}/></div><span className="mono-tabular" style={{width:70,textAlign:"right",fontSize:12,color:"#585755"}}>{nfShort(v)}</span><span className="mono-tabular" style={{width:42,textAlign:"right",fontSize:11,color:"#8A8985"}}>{nfPct(pct,0)}</span></div>);})}</div>}{vb.rooms&&<div style={{marginTop:10,paddingTop:10,borderTop:"1px dashed var(--hm-gray-soft)",display:"flex",gap:18,fontFamily:"var(--font-mono)",fontSize:12,color:"#3B3A38"}}><span>休息 <strong>{vb.rooms.rest}</strong> 次</span><span>住宿 <strong>{vb.rooms.stay}</strong> / {vb.rooms.total} 間</span><span style={{color:"#8A8985"}}>OCC {nfPct(vb.rooms.stay/vb.rooms.total,0)}</span></div>}</div>)}</div></div></div>);
}

function App(){
  const[daily,setDaily]=useState(null);
  const[isDemo,setIsDemo]=useState(false);
  const[isLive,setIsLive]=useState(false);
  const[loading,setLoading]=useState(true);
  const[loadError,setLoadError]=useState(null);
  const[monthlyTargets,setMonthlyTargets]=useState(HMOTEL_CONFIG.MONTHLY_TARGET);
  const[lastUpdated,setLastUpdated]=useState(null);
  const[dimension,setDimension]=useState("day");
  const[view,setView]=useState("combined");
  const[drillRow,setDrillRow]=useState(null);
  const[customRange,setCustomRange]=useState(null);
  const[yoyMode,setYoyMode]=useState("yoy");
  const[heatMode,setHeatMode]=useState("checkin");
  const[density,setDensity]=useState("comfortable");

  const loadData=useCallback(async()=>{
    setLoading(true);setLoadError(null);
    // 使用無假資料骨架作為基礎
    const base=generateDailyMeta(730);
    const allRows=[];
    let hasRealData=false;

    // 1. 優先載入本地 CSV 檔
    try{
      const csvRows=await loadFromCSV();
      if(csvRows.length>0){allRows.push(...csvRows);hasRealData=true;}
    }catch(e){console.warn('CSV 載入失敗:',e);}

    // 2. 嘗試 API（有更新資料則疊加）
    const apiUrl=HMOTEL_CONFIG.API_URL;
    if(apiUrl&&apiUrl.trim()!==''){
      try{
        const res=await fetch(apiUrl+'?t='+Date.now());
        if(res.ok){
          const json=await res.json();
          if(json.status==='ok'){
            allRows.push(...(json.rows||[]));hasRealData=true;
            const rawTarget=json.settings?.monthly_targets||json.settings?.monthly_target;
            if(rawTarget!=null){setMonthlyTargets(typeof rawTarget==='object'?rawTarget:HMOTEL_CONFIG.MONTHLY_TARGET);}
          }
        }
      }catch(e){console.warn('API 載入失敗（CSV 資料仍有效）:',e);}
    }

    if(hasRealData){
      const merged=mergeApiData(allRows,base);
      setDaily(merged);setIsDemo(false);setIsLive(true);
      setLastUpdated(new Date().toLocaleString('zh-TW'));
    }else{
      // 完全無資料時才用假資料示警
      const fallback=generateDaily(42);
      setDaily(fallback);setIsDemo(true);setIsLive(false);
    }
    setLoading(false);
  },[]);

  useEffect(()=>{loadData();},[loadData]);

  // 依目前檢視館別取對應月目標
  const monthlyTarget=useMemo(()=>{
    const t=monthlyTargets;
    if(typeof t==='number')return t;
    return t[view]||t.combined||8000000;
  },[monthlyTargets,view]);

  const series=useMemo(()=>daily?buildSeries(daily,dimension,view,customRange):null,[daily,dimension,view,customRange]);
  const monthSnap=useMemo(()=>daily?buildMonthSnapshot(daily,view,monthlyTarget):null,[daily,view,monthlyTarget]);
  const yoy=useMemo(()=>daily?buildYoY(daily,view,yoyMode):null,[daily,view,yoyMode]);
  const performanceMetrics=useMemo(()=>daily?buildPerformanceMetrics(daily,view,dimension):null,[daily,view,dimension]);
  const heatmapData=useMemo(()=>daily?buildHeatmap(daily,view):null,[daily,view]);
  const forecastAlerts=useMemo(()=>daily?buildForecastAlerts(daily,view,monthlyTarget):null,[daily,view,monthlyTarget]);
  const weekdayAvg=useMemo(()=>daily?buildWeekdayAvg(daily,view):null,[daily,view]);
  const yesterdayComp=useMemo(()=>daily?buildYesterdayComp(daily,view):null,[daily,view]);
  const isDense=density==="compact";

  if(loading){
    return(<div className="loading-screen"><div className="spinner"/><div style={{fontSize:14,color:"var(--hm-gray-mid)"}}>載入儀錶板資料...</div></div>);
  }
  if(!daily||!series||!monthSnap)return null;

  return(
    <div className={"app "+(isDense?"is-dense":"")}>
      <Header dimension={dimension} setDimension={setDimension} view={view} setView={setView} customRange={customRange} setCustomRange={setCustomRange} isDemo={isDemo} isLive={isLive}/>

      {isDemo&&(
        <div className="demo-banner">
          <span>⚠️ <strong>離線示範模式</strong>｜無法載入 CSV 資料，目前顯示的是示範資料。</span>
          <button className="btn-ghost-sm" onClick={loadData}>↻ 重新載入</button>
        </div>
      )}
      {isLive&&lastUpdated&&(
        <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8,fontSize:11,color:"var(--hm-gray-mid)"}}>
          <span className="live-dot" style={{marginRight:6}}/> 即時資料・更新於 {lastUpdated}
          <button className="btn-ghost-sm" onClick={loadData} style={{marginLeft:8}}>↻ 重新整理</button>
        </div>
      )}

      {/* KPI Strip */}
      <section className="kpi-strip">
        <KpiCard eyebrow={monthSnap.label+"・實際 + 預估"} big={nfShort(monthSnap.forecast)} tag={monthSnap.forecast>=monthSnap.target?"達標":"未達標"} tagColor={monthSnap.forecast>=monthSnap.target?"ok":"warn"} sub={`目標 ${nfShort(monthSnap.target)}・差 ${nfSigned(monthSnap.forecast-monthSnap.target)}`}><ForecastBar actual={monthSnap.actual} forecast={monthSnap.forecast} target={monthSnap.target} label={monthSnap.label}/></KpiCard>
        <KpiCard eyebrow="本月日均營收" big={nfShort(monthSnap.dailyAvg)} sub={`已過 ${monthSnap.daysElapsed} / ${monthSnap.daysInMonth} 天`} tag={`${nfPct(monthSnap.completion,0)} 進度`} tagColor="neutral"><SparklineLite values={monthSnap.dailySeries} kpi={monthlyTarget/30}/></KpiCard>
        <KpiCard eyebrow={yoy.mode==="yoy"?"同期比 (YoY)":"月對月 (MoM)"} big={nfPct(yoy.pct,1)} tag={yoy.pct>=0?"上升":"下降"} tagColor={yoy.pct>=0?"ok":"warn"} sub={`${yoy.thisLabel} ${nfShort(yoy.thisVal)}・${yoy.lastLabel} ${nfShort(yoy.lastVal)}`}>
          <YoYBars thisYear={yoy.thisVal} lastYear={yoy.lastVal} thisLabel={yoy.thisLabel} lastLabel={yoy.lastLabel}/>
          <div style={{display:"flex",gap:4,marginTop:6}}>
            <button className="tiny-toggle" onClick={()=>setYoyMode("yoy")} data-active={yoyMode==="yoy"}>年對年</button>
            <button className="tiny-toggle" onClick={()=>setYoyMode("mom")} data-active={yoyMode==="mom"}>月對月</button>
          </div>
        </KpiCard>
        <KpiCard eyebrow="昨日表現" big={nf(monthSnap.yesterday.totalRev)} tag={`住宿率 ${nfPct(monthSnap.yesterday.stay/monthSnap.yesterday.totalRooms,0)}・休息率 ${nfPct(monthSnap.yesterday.rest/monthSnap.yesterday.totalRooms,0)}`} tagColor="neutral">{(()=>{const yd=monthSnap.yesterday;const other=yd.totalRev-yd.stayRev-yd.restRev;const items=[{label:`住宿 ${yd.stay}間`,val:yd.stayRev,color:"var(--hm-gray)"},{label:`休息 ${yd.rest}次`,val:yd.restRev,color:"var(--hm-yellow)"},{label:"其他",val:other,color:"var(--hm-gray-soft)"}];return(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginTop:8}}>{items.map(it=>{const pct=yd.totalRev?it.val/yd.totalRev*100:0;return(<div key={it.label}><div style={{fontSize:10,color:"#8A8985",marginBottom:3}}>{it.label}</div><div style={{fontFamily:"var(--font-mono)",fontSize:13,color:"var(--hm-ink)",fontWeight:600}}>{nf(it.val)}</div><div style={{marginTop:5,height:3,background:"var(--hm-gray-pale)",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:it.color,borderRadius:2}}/></div><div style={{fontSize:10,color:"#8A8985",marginTop:2}}>{pct.toFixed(1)}%</div></div>);})}</div>);})()}</KpiCard>
      </section>

      {/* 主趨勢圖 */}
      <section className="card big-trend">
        <div className="card-head">
          <div>
            <div className="eyebrow">營收趨勢 / Revenue Trend</div>
            <h3 className="card-title">{VIEWS.find(v=>v.id===view).label}・{DIMENSIONS.find(d=>d.id===dimension).label}</h3>
          </div>
          <div className="legend-row">
            {CATEGORIES.map(c=><span className="legend-pill" key={c}><i style={{background:CAT_COLORS[c]}}/>{c}</span>)}
            {dimension==="day"&&<><span className="legend-divider"/><span className="legend-pill"><i className="band-yellow"/>週末</span><span className="legend-pill"><i className="band-red"/>年節</span></>}
          </div>
        </div>
        <StackedBarTrend rows={series.rows} dimension={dimension} venueKey={view} onBarClick={r=>setDrillRow(r)} highlightHolidays={true} forecast={dimension==="day"?series.forecast:null} kpi={dimension==="day"?monthlyTarget/30:null}/>
        <div className="trend-footer">
          <span className="text-xs muted">點擊長條可查看當{{"day":"日","month":"月","year":"年"}[dimension]}細項</span>
          {dimension==="day"&&series.forecast&&<span className="text-xs muted" style={{display:"inline-flex",alignItems:"center",gap:6}}><i style={{display:"inline-block",width:18,borderTop:"1.5px dashed #3B3A38",height:1}}/>預估趨勢（過去 14 日加權平均 + 週末/年節權重）</span>}
        </div>
      </section>

      {/* 第二排 */}
      <section className="grid-secondary">
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div className="card card-compact">
            <div className="eyebrow">週間平均</div>
            <h4 className="card-title-sm">各星期日均業績</h4>
            <div style={{marginTop:12}}><WeekdayAvgPanel data={weekdayAvg}/></div>
          </div>
          <div className="card card-compact">
            <div className="eyebrow">昨日 vs 前14日均</div>
            <h4 className="card-title-sm">當日比較</h4>
            <div style={{marginTop:12}}><YesterdayCompPanel data={yesterdayComp}/></div>
          </div>
        </div>
        <div className="card">
          <div className="eyebrow">營運指標</div>
          <h4 className="card-title-sm">RevPAR・ADR・房間使用</h4>
          <div style={{marginTop:12}}><PerformanceMetrics data={performanceMetrics}/></div>
        </div>
        <div className="card">
          <div className="eyebrow">預測 & 警示</div>
          <h4 className="card-title-sm">未來 7 日</h4>
          <div style={{marginTop:12}}><ForecastAlerts alerts={forecastAlerts}/></div>
          {monthSnap&&(()=>{
            const daysLeft=monthSnap.daysInMonth-monthSnap.daysElapsed;
            const gap=monthSnap.target-monthSnap.actual;
            const needed=daysLeft>0?gap/daysLeft:0;
            const current=monthSnap.dailyAvg;
            const diff=needed-current;
            const ok=diff<=0;
            return(<div style={{marginTop:16,paddingTop:14,borderTop:"1px dashed var(--hm-gray-soft)"}}>
              <div style={{fontSize:11,color:"#8A8985",marginBottom:10,letterSpacing:"0.06em",textTransform:"uppercase"}}>達標缺口分析</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                <div style={{background:"var(--hm-gray-pale)",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#8A8985",marginBottom:3}}>剩餘天數</div>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:18,fontWeight:700,color:"var(--hm-ink)"}}>{daysLeft} 天</div>
                </div>
                <div style={{background:"var(--hm-gray-pale)",borderRadius:6,padding:"8px 10px"}}>
                  <div style={{fontSize:10,color:"#8A8985",marginBottom:3}}>缺口</div>
                  <div style={{fontFamily:"var(--font-mono)",fontSize:18,fontWeight:700,color:ok?"#4F8A5C":"#C0392B"}}>{ok?"達標":nfShort(gap)}</div>
                </div>
              </div>
              <div style={{background:ok?"rgba(79,138,92,0.08)":"rgba(192,57,43,0.08)",borderRadius:6,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"#8A8985",marginBottom:4}}>每日需達</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:20,fontWeight:700,color:ok?"#4F8A5C":"#C0392B"}}>{nfShort(needed)}</div>
                <div style={{fontSize:11,color:"#8A8985",marginTop:4}}>目前日均 {nfShort(current)}・{ok?"已超出目標":`還差 ${nfShort(diff)}`}</div>
              </div>
            </div>);
          })()}
        </div>
      </section>

      {/* 熱力圖 */}
      <section className="card">
        <div className="card-head">
          <div>
            <div className="eyebrow">熱力圖 / Day × Hour</div>
            <h4 className="card-title-sm">{heatMode==="checkin"?"過去 14 日・Check-in 時段分佈":"過去 14 日・住宿 + 休息間數分佈"}</h4>
          </div>
          <div className="heatmap-legend"><span>低</span><div className="heat-grad"/><span>高</span></div>
        </div>
        <HourHeatmap days={heatmapData} mode={heatMode} onModeChange={setHeatMode}/>
      </section>

      {/* 密度切換 */}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:-8,marginBottom:16}}>
        <button className="tiny-toggle" onClick={()=>setDensity("comfortable")} data-active={density==="comfortable"}>寬鬆</button>
        <button className="tiny-toggle" onClick={()=>setDensity("compact")} data-active={density==="compact"}>緊湊</button>
      </div>

      {drillRow&&<DrillDown row={drillRow} onClose={()=>setDrillRow(null)} dimension={dimension} venueKey={view} daily={daily}/>}
    </div>
  );
}

// ===== 密碼保護 =====
function PasswordGate({ onUnlock }) {
  const [val, setVal] = useState('');
  const [err, setErr] = useState(false);
  const [errMsg, setErrMsg] = useState('');

  const check = () => {
    if (val === HMOTEL_PASSWORD) {
      sessionStorage.setItem('hm_auth', '1');
      onUnlock();
    } else {
      setErr(true);
      setErrMsg('密碼錯誤，請再試一次');
      setTimeout(() => setErr(false), 600);
    }
  };

  return (
    <div className="pw-gate">
      <div className="pw-box">
        <div className="pw-logo">H</div>
        <div className="pw-title">H MOTEL</div>
        <div className="pw-sub">營收儀錶板 / Revenue Dashboard</div>
        <input
          className={"pw-input" + (err ? " pw-error" : "")}
          type="password"
          placeholder="請輸入密碼"
          value={val}
          onChange={e => { setVal(e.target.value); setErrMsg(''); }}
          onKeyDown={e => e.key === 'Enter' && check()}
          autoFocus
        />
        <button className="pw-btn" onClick={check}>進入儀錶板 →</button>
        <div className="pw-err-msg">{errMsg}</div>
      </div>
    </div>
  );
}

function Root() {
  const [unlocked, setUnlocked] = useState(
    sessionStorage.getItem('hm_auth') === '1'
  );
  if (!unlocked) return <PasswordGate onUnlock={() => setUnlocked(true)} />;
  return <App />;
}

// Render
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root/>);
</script>
</body>
</html>
